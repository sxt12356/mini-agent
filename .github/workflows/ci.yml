name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mini_user
          POSTGRES_PASSWORD: mini_password
          POSTGRES_DB: mini_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_user -d mini_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      OPENAI_API_KEY: test-key
      OPENAI_MODEL: gpt-5
      EMBEDDING_MODEL: text-embedding-3-small
      AGENT_LOG_DIR: logs

      DATABASE_URL: postgresql+psycopg://mini_user:mini_password@localhost:5432/mini_agent
      REDIS_URL: redis://localhost:6379/15

      JWT_SECRET_KEY: ci-test-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

      CHAT_RATE_LIMIT_PER_MINUTE: 2
      CHAT_RATE_LIMIT_PER_DAY: 100
      LOGIN_IP_RATE_LIMIT_PER_MINUTE: 20
      LOGIN_USER_IP_RATE_LIMIT_PER_MINUTE: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest --cov=. --cov-report=term-missing
